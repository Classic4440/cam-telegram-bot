services:
  - type: web
    name: cam-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      # Optional, comma-separated Telegram user IDs authorized to administer the bot.
      - key: ADMIN_IDS
        sync: false
